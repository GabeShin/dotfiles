# Refresh tmux configuration
unbind r 
bind r source-file ~/.tmux.conf

set -g mouse on

# Splitting Windows
bind / split-window -h
bind - split-window -v
unbind '"'
unbind %

# Window Resizing
bind -r j resize-pane -D 2
bind -r k resize-pane -U 2
bind -r l resize-pane -R 2
bind -r h resize-pane -L 2

# Copy mode 
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

set-option -g status-position top

set -g base-index 1
setw -g pane-base-index 1

set-option -g renumber-windows on

# List of plugins
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @plugin 'tmux-plugins/tpm'

# Persistent tmux sessions
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality
set -g @continuum-save-interval '5' # autosave every 5 min instead of the 15 min default

# Rename a window and snapshot immediately, so the name survives a restart even
# if the next autosave never happens.
bind , command-prompt -I "#W" { rename-window "%%" ; run-shell "~/.tmux/plugins/tmux-resurrect/scripts/save.sh" }

# Catppuccin beauitfy
### https://github.com/catppuccin/tmux
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
# Show the window NAME (#W, what `prefix + ,` sets) instead of the pane title (#T).
# catppuccin v2 defaults both of these to " #T", which is why the label changed
# as you moved between panes/windows.
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
# Dead v1 option names, silently ignored by catppuccin v2.1.3. v2 equivalents:
#   @catppuccin_window_status        -> @catppuccin_window_flags ('none'|'icon'|'text')
#   @catppuccin_window_default_text  -> @catppuccin_window_text
#   @catppuccin_window_current_color -> @catppuccin_window_current_text_color
#   @catppuccin_window_{default,current}_fill -> removed, set the colors instead
set -g @catppuccin_date_time_text '%d.%m. %H:%M'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'

# set left and right status bar
set -g allow-rename off
set -g automatic-rename off
set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session} '
set -gF status-right '#{E:@catppuccin_status_primary_ip}'
set -ag status-right '#{E:@catppuccin_status_date_time}'

display-message "Successfully loaded .tmux.conf ✅"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
